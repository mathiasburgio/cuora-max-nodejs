<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuora MAX - NodeJS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" >
    <style>
        #peso{
            position: sticky;
            top: 10px;
            left: 10px;
            font-size: 48px;
            z-index: 10;
        }
    </style>
</head>
<body style="position: relative;">
    <span id="peso" class="text-monospace bg-info text-white p-3 rounded">
        PESO
    </span>
    <div class="container py-5">
        <div class="card mb-5">
            <div class="card-header">
                Conexión
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label for="puerto">Puerto</label>
                    <div class="input-group">
                        <select name="puerto" class="form-control"></select>
                        <div class="input-group-append">
                            <button class="btn btn-primary" name="obtener-puertos">Obtener</button>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="id">ID</label>
                    <input type="text" autocomplete="off" name="id" class="form-control">
                </div>
                <button class="btn btn-primary mr-3" name="conectar">Conectar</button>
                <button class="btn btn-danger" disabled name="desconectar">Desconectar</button>
            </div>
        </div>
    
        <div class="card mb-5">
            <div class="card-header">
                Marquesina
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label for="">Texto (max 100 caracteres)</label>
                    <input type="text" autocomplete="off" name="marquesina" class="form-control" maxlength="100">
                </div>
                <button class="btn btn-primary" name="enviar-marquesina">Enviar</button>
            </div>
        </div>

        <div class="card mb-5">
            <div class="card-header">
                Sectores (categorias/grupos. Ej "Verdulería", "Carnicería", etc)
            </div>
            <div class="card-body">
                <button class="btn btn-primary mr-3" name="obtener-sectores">Obtener sectores</button>
                <div class="border mt-3">
                    <table class="table table-sm mb-0" name="tabla-sectores">
                        <thead class="thead-dark">
                            <tr>
                                <th>Número</th>
                                <th>Nombre</th>
                                <th></th><!--boton quitar-->
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <div class="card mb-5">
            <div class="card-header">
                Productos
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-8">
                        <button class="btn btn-primary mr-3" name="obtener-productos">Obtener productos</button>
                    </div>
                    <div class="col-4 text-right">
                        <div class="input-group">
                            <input type="number" class="form-control" name="leer-plu" placeholder="PLU a leer">
                            <div class="input-group-append">
                                <button class="btn btn-primary" name="leer-producto">Leer</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="border mt-3">
                    <table class="table table-sm mb-0" name="tabla-productos">
                        <thead class="thead-dark">
                            <tr>
                                <th>PLU</th>
                                <th>Sector</th>
                                <th>Nombre</th>
                                <th>Precio</th>
                                <th></th><!--boton quitar-->
                            </tr>
                        </thead>
                        <tbody></tbody>
                        <tfoot>
                            <tr>
                                <td colspan="100%">
                                    <button class="btn btn-block btn-primary" name="agregar-producto">Agregar producto</button>
                                </td>
                            </tr>
                        </tfoot>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" ></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
    <script src="script.js"></script>
    <script>
        let index;
        window.onload = () => {
            index = new Index();
        };
    </script>
</body>
</html>
